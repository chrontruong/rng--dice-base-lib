spring.application.name=slot-games-service-test
spring.kafka.template.default-topic=logger001
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.enviromentType=test
service.enableKafka=false
service.startTest=true
service.maxSizeQueue=100
service.internalServiceType.rtpConfigService=test

logging.path=log

game.normal.config.file=classpath:SlotGame_Normal_Config.json
game.free.config.file=classpath:SlotGame_Free_Config.json
game.mini.config.file=classpath:SlotGame_Mini_Config.json
game.gamble.config.file=classpath:SlotGame_Gamble_Config.json
extension.config.file=classpath:Extension_Config.json

zeromq.producers.event.host=tcp://*:8888
zeromq.producers.event.useForwarder=true
zeromq.consumers.event.host=tcp://*:8888
zeromq.topic.announce=event-done
zeromq.topic.status=event-status
zeromq.numOfThread=1
event.grpc.host=128.199.221.15
event.grpc.port=1198
event.announce.topic=event-done
event.status.topic=event-status
