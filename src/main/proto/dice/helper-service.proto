syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.io.begstd.dice.grpc.dicegame";

service HelperDiceService {
    rpc getActivePlayers(ActiveDicePlayerRequest) returns (ActiveDicePlayerResponse) {};
    rpc getServiceGameConfig(ServiceDiceGameConfigRequest) returns (ServiceDiceGameConfigResponse) {};
    rpc getServiceProperty(ServiceDicePropertyRequest) returns (ServiceDicePropertyResponse) {};
    rpc getTotalActivePlayers(GetTotalActiveDicePlayersReq) returns (GetTotalActiveDicePlayersResp);
}

message ActiveDicePlayerRequest {
}

message ActiveDicePlayerResponse {
    repeated ActiveDicePlayerSG activePlayers = 1;
}

message ActiveDicePlayerSG {
    string playerId = 1;
    int32 status = 2;
}

message ServiceDiceGameConfigRequest {

}

message ServiceDiceGameConfigResponse {
    string config = 1;
}

message ServiceDicePropertyRequest {

}

message ServiceDicePropertyResponse {
    string property = 1;
}

message GetTotalActiveDicePlayersReq {
}

message GetTotalActiveDicePlayersResp {
    int32 totalUsers = 1;
    int32 totalBots = 2;
}
