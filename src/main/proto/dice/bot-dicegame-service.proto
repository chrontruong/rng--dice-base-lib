syntax = "proto3";

import "google/protobuf/struct.proto";
option java_multiple_files = true;
option java_package = "com.io.begstd.dice.grpc.dicebot";

service BotDiceGameService {
    rpc botJoinGame(DiceBotPlayerInfo) returns (DiceResponseStatusBotSG) {};
    rpc botPlayNormalSpin (DiceBotNormalSpin) returns (DiceResponseStatusBotSG) {};
    rpc botResumeGameInfo(DiceBotResumeSpin) returns (DiceResponseStatusBotSG) {};
}

message DiceBotResumeSpin {
    string uId = 1;
    string cId = 2;
    DiceBotJoinGameDetail ud = 16;
}


message DiceBotPlayerInfo {
    string sId = 1;
    string uId = 2;
    string cId = 3;
    int32 env = 4;
    DiceBotJoinGameDetail ud = 16;
    string c = 17;
}

message DiceBotNormalSpin {
    string uId = 1;
    string cId = 2;
    string bId = 3;
    double talB = 16;
    repeated int32 bLn = 17;
    DiceBotJoinGameDetail ud = 18;
    int32 wo = 19;
}

message DiceResponseStatusBotSG {
    string c = 1;
    google.protobuf.Struct st = 2;
}

message DiceBotJoinGameDetail {
    double money = 1;
    double extraMoney = 2;
    string displayName = 3;
    string fullname = 4;
    string email = 5;
    string phone = 6;
    string address = 7;
    string birthday = 8;
    string country = 9;
    string gender = 10;
    string avatar = 11;
    string registerIp = 12;
    string ip = 13;
    string os = 14;
    string device = 15;
    string browser = 16;
    repeated string denyGameIds = 17;
    string userType = 18;
    string userAgent = 19;
    string agencyId = 20;
    string memberId = 21;
    string externalId = 22;
    string currency = 23;
}
