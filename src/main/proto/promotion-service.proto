syntax = "proto3";

import "google/protobuf/struct.proto";

option java_multiple_files = true;
option java_package = "com.io.begstd.slot.grpc.promotionservice";

service PromotionService {
    // call when client join game.
    rpc usePromotionCode(UsePromotionCodeRequest) returns (PromotionResponse);
    // call to check whether user has promotion code in specific serviceId or not.
    rpc checkUserHasPromotion (CheckPromotiontRequest) returns (PromotionResponse);
    // call when user use this promotion to spin slot game
    rpc minusPromotionData (MinusPromotionDataRequest) returns (PromotionResponse);
    rpc reservePromotionData (ReservePromotionDataRequest) returns (PromotionResponse);
    rpc commitPromotionData (CommitPromotionDataRequest) returns (PromotionResponse);
    rpc releasePromotionData (ReleasePromotionDataRequest) returns (PromotionResponse);

    rpc reserveAllPromotionData (ReserveAllPromotionDataRequest) returns (PromotionResponse);

    rpc checkServiceHasPromotion(CheckServiceHasPromotionRequest) returns (CheckServiceHasPromotionResponse);
}

message CheckServiceHasPromotionRequest {
    string serviceId = 1;
    string commandId = 2;
}

message CheckServiceHasPromotionResponse {
    bool result = 1;
}

message UsePromotionCodeRequest {
    string code = 1;
    string userId = 2;
    string serviceId = 3;
    string commandId = 4;
    string currency = 5;
}

message CheckPromotiontRequest {
    string userId = 1;
    string serviceId = 2;
    string commandId = 3;
    string currency = 4;
}

message MinusPromotionDataRequest {
    string promotionCode = 1;
    string userId = 2;
    string serviceId = 3;
    string commandId = 4;
    string currency = 5;
}

message ReservePromotionDataRequest {
    string promotionCode = 1;
    string userId = 2;
    string serviceId = 3;
    int32 numberSpin = 4; // number of spin want to reserve (slot: numberSpin = 1)
    string commandId = 5;
    string currency = 6;
}

message ReserveAllPromotionDataRequest {
    string promotionCode = 1;
    string userId = 2;
    string serviceId = 3;
    string commandId = 4;
    string currency = 5;
}

message CommitPromotionDataRequest {
    string promotionCode = 1;
    string userId = 2;
    string serviceId = 3;
    int32 numberSpin = 4; // number of spin want to commit (slot: numberSpin = 1)
    string commandId = 5;
    string currency = 6;
}

message ReleasePromotionDataRequest {
    string promotionCode = 1;
    string userId = 2;
    string serviceId = 3;
    int32 numberSpin = 4; // number of spin want to release (slot: numberSpin = 1)
    string commandId = 5;
    string currency = 6;
}

message PromotionResponse {
    string commandId = 1;
    int32 code = 2; // status of response, 0 for success
    string message = 3; // message to describe the code above.
    PromotionData promotionData = 4;
}

message PromotionData {
    string userId = 1;
    string promotionCode = 2;
    string promotionName = 3;
    bool   isValid = 4;
    string serviceId = 5;
    int64 expireAt = 6;
    google.protobuf.Struct data = 7; //{betid: 10, remain: 5}
    string currency = 8;
}