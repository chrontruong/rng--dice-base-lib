name: Deploy to Staging 

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11.0.27'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings for Nexus
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>vortech-nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>

            <profiles>
              <profile>
                <id>vortech-nexus</id>
                <repositories>
                  <repository>
                    <id>vortech-nexus</id>
                    <name>Nexus Internal Releases</name>
                    <url>${NEXUS_MAVEN_URL}</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>

            <activeProfiles>
              <activeProfile>vortech-nexus</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          NEXUS_MAVEN_URL: ${{ secrets.NEXUS_MAVEN_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Extract Maven coordinates
        id: maven
        run: |
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          JAR_NAME="${ARTIFACT_ID}-${VERSION}.jar"
          GROUP_PATH=$(echo "${GROUP_ID}" | tr '.' '/')
          SUB_FIX="snapshots"

          echo "groupId=${GROUP_ID}" >> $GITHUB_OUTPUT
          echo "artifactId=${ARTIFACT_ID}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "jarName=${JAR_NAME}" >> $GITHUB_OUTPUT
          echo "groupPath=${GROUP_PATH}" >> $GITHUB_OUTPUT
          echo "sub_fix=$SUB_FIX" >> $GITHUB_OUTPUT

      - name: Check if artifact exists on Nexus
        id: check_artifact
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_REPOSITORY_NAME: ${{ secrets.NEXUS_REPOSITORY_NAME }}-${{ steps.maven.outputs.sub_fix }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          
        run: |
          set -euo pipefail

          BASE_PATH="${{ steps.maven.outputs.groupPath }}/${{ steps.maven.outputs.artifactId }}/${{ steps.maven.outputs.version }}"
          BASE_URL="${NEXUS_URL}/repository/${NEXUS_REPOSITORY_NAME}/${BASE_PATH}"

          ARTIFACT_ID="${{ steps.maven.outputs.artifactId }}"
          VERSION="${{ steps.maven.outputs.version }}"
          JAR_NAME="${{ steps.maven.outputs.jarName }}"

          ARTIFACT_URL="${BASE_URL}/${JAR_NAME}"
          RESOLVED_JAR="${JAR_NAME}"

          echo "Checking for existing artifact at ${ARTIFACT_URL}"

          STATUS_CODE=$(curl -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            --silent --output /dev/null --write-out "%{http_code}" \
            "${ARTIFACT_URL}")

          echo "status=${STATUS_CODE}" >> $GITHUB_OUTPUT
          echo "resolvedJar=${RESOLVED_JAR}" >> $GITHUB_OUTPUT
          echo "downloadUrl=${ARTIFACT_URL}" >> $GITHUB_OUTPUT

          if [ "${STATUS_CODE}" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Artifact exists."
          elif [ "${STATUS_CODE}" = "404" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Artifact does not exist and will be built."
          else
            echo "Unexpected status code ${STATUS_CODE} while checking artifact."
            exit 1
          fi

      - name: Build JAR with Maven
        if: steps.check_artifact.outputs.exists != 'true'
        run: mvn clean install

      - name: Capture built JAR path
        if: steps.check_artifact.outputs.exists != 'true'
        id: built_jar
        run: |
          JAR_FILE="target/${{ steps.maven.outputs.jarName }}"
          if [ ! -f "${JAR_FILE}" ]; then
            echo "Expected JAR not found at ${JAR_FILE}"
            exit 1
          fi
          echo "file=${JAR_FILE}" >> $GITHUB_OUTPUT

      - name: Upload JAR to Nexus repository
        if: steps.check_artifact.outputs.exists != 'true'
        run: |
          mvn deploy:deploy-file \
            -DgroupId="${{ steps.maven.outputs.groupId }}" \
            -DartifactId="${{ steps.maven.outputs.artifactId }}" \
            -Dversion="${{ steps.maven.outputs.version }}-SNAPSHOT" \
            -Dpackaging=jar \
            -Dfile="${{ steps.built_jar.outputs.file }}" \
            -DuniqueVersion=false \
            -DrepositoryId=vortech-nexus \
            -Durl="${{ secrets.NEXUS_URL }}/repository/${{ secrets.NEXUS_REPOSITORY_NAME }}-${{ steps.maven.outputs.sub_fix }}/"
